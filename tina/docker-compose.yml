# One command starts the whole challenge:
#   docker compose up -d --build
services:
  challenge:
    build: .
    container_name: tina-ctf
    ports:
      - "8101:8101"
    environment:
      # Single source of truth for the flag — pick a unique one for your challenge.
      CHALLENGE_FLAG: "cogito{t1n4_s4g_j4}"
      LLM_BASE_URL: "https://llm.hpc.ntnu.no/v1"
      LLM_MODEL: "openai/gpt-oss-120b"
      # Ekte LLM-Tina: nøkkelen kommer fra NTNU_API_KEY (miljøet eller tina/.env,
      # som er git-ignored). Uten nøkkel: deterministisk mock-Tina (offline-fallback).
      LLM_API_KEY: "${NTNU_API_KEY:-}"
      # Litt variasjon i Tina — ikke deterministisk; reglene styrer systemprompten.
      LLM_TEMPERATURE: "0.7"
    restart: unless-stopped
